name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 當 'main' 分支有新的提交時，觸發這個工作流程

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 在最新的 Ubuntu 環境上運行

    steps:
      - name: Checkout Repository # 步驟 1: 檢出您的程式碼
        uses: actions/checkout@v4

      - name: Set up JDK 21 # 步驟 2: 設定 Java 開發工具包 (JDK) 版本
        uses: actions/setup-java@v4
        with:
          java-version: '21' # <-- 您的 Java 版本
          distribution: 'temurin' # 推薦的 OpenJDK 發行版
          cache: 'maven' # 啟用 Maven 依賴緩存，加速建置

      - name: Build Java project and package static files # 步驟 3: 建置您的 Maven 專案
        run: |
          mvn clean install -DskipTests # 執行 Maven 建置命令，跳過測試

      - name: Deploy to GitHub Pages # 步驟 4: 部署靜態檔案到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3 # 使用第三方 Actions 來處理部署
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # GitHub 自動提供的 token，用於授權
          publish_dir: ./target/classes/static # <-- 這裡指定 Maven 建置後靜態檔案的輸出路徑
          publish_branch: gh-pages # <-- 關鍵修改: 將部署目標分支設定為 gh-pages
          # 注意: 由於部署到 gh-pages 分支，不需要 destination_dir 這一行，請確保它已被刪除