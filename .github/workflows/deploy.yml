name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 當 'main' 分支有新的提交時，觸發這個工作流程

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 # 根據您的 Java 版本調整
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Java project and package static files
        run: |
          mvn clean install -DskipTests # 執行 Maven 建置

      - name: Deploy to GitHub Pages # 使用 peaceiris/actions-gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/classes/static # Java 專案建置後，靜態檔案的來源路徑
          
          # --- 關鍵修改點 ---
          # 讓它推送到 'main' 分支，並且放在 'docs' 資料夾下
          publish_branch: main # <--- 將目標分支改為 main
          destination_dir: docs # <--- 指定在 main 分支下的目標資料夾
          # --- 關鍵修改點 ---