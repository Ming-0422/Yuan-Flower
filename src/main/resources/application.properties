# 伺服器設定
# 設定 Spring Boot 應用程式運行的埠號。
server.port=8080



# MySQL 資料庫連線設定
# Spring Boot 會透過這個 URL 連接到您的 MySQL 資料庫。
# localhost:3307 指的是您的電腦 IP 和映射出來的埠號，請確保與您的 Docker MySQL 容器埠號一致。
# yuan_flower_db 是您在 Docker MySQL 中建立的資料庫名稱。
# useSSL=false 建議在開發環境中設定，避免 SSL 問題。
# serverTimezone=Asia/Taipei 用於處理時區問題，建議設定為專案或伺服器所在時區 (例如台灣為 Asia/Taipei)。
# characterEncoding=UTF-8 設定資料庫連線的字元編碼為 UTF-8，以確保中文等字元正確顯示。
# allowPublicKeyRetrieval=true 在 MySQL 8.0 或更高版本中，若客戶端使用舊版認證方式連接，需要此設定。
spring.datasource.url=jdbc:mysql://localhost:3307/yuan_flower_db?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8&allowPublicKeyRetrieval=true

# 資料庫使用者名稱 (您 Docker MySQL 容器的 root 用戶)。
spring.datasource.username=root

# 資料庫密碼 (您在 docker run 命令中為 root 設定的密碼，例如 123456 或您實際設定的密碼)。
spring.datasource.password=123456

# MySQL JDBC 驅動類名。
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# JPA/Hibernate 設定 (如果您使用 Spring Data JPA 來操作資料庫)
# ddl-auto: update 會根據您的 Java 實體類自動更新資料庫表格結構 (開發階段常用，生產環境建議使用 migrate 或 validate)。
# show-sql: true 會在控制台印出執行的 SQL 語句 (方便除錯)。
# format_sql: true 會格式化輸出的 SQL 語句，使其更易讀。
# dialect: 根據您的 MySQL 版本選擇對應的方言，這裡設定為 MySQL 8 的方言。
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true



# LINE Bot 設定
# 請至 LINE Developers Console 取得以下資訊，並替換為您實際的 Channel Access Token、Channel Secret 和管理員使用者 ID。
line.bot.channel-token=YOUR_CHANNEL_ACCESS_TOKEN_HERE
line.bot.channel-secret=YOUR_CHANNEL_SECRET_HERE
line.bot.admin-user-id=YOUR_LINE_USER_ID_HERE

# LINE Bot Webhook 回呼路徑。
line.bot.handler.path=/callback



# 日誌設定
# 設定應用程式不同套件的日誌級別。
# com.example.yuan 套件下的日誌級別設定為 DEBUG。
# org.springframework.security 套件下的日誌級別設定為 DEBUG (用於除錯 Spring Security 相關問題)。
logging.level.com.example.yuan=DEBUG
logging.level.org.springframework.security=DEBUG



# 編碼設定
# 確保 HTTP 請求和回應使用 UTF-8 編碼，以正確處理多語言字元。
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true



# 靜態資源設定
# 定義靜態資源的查找路徑。
# classpath:/static/ 會查找 src/main/resources/static/ 目錄下的資源。
# file:./ 會查找應用程式執行目錄下的資源。
# add-mappings=true 表示啟用靜態資源映射。
spring.web.resources.static-locations=classpath:/static/,file:./
spring.web.resources.add-mappings=true