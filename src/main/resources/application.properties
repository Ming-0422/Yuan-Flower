line.bot.handler.path=/callback

# LINE Bot 自動配置（生產環境啟用）
spring.autoconfigure.exclude=${EXCLUDE_AUTOCONFIGURE:com.linecorp.bot.spring.boot.autoconfigure.LineBotAutoConfiguration}

# 日誌設定
logging.level.com.example.yuan=${LOG_LEVEL:DEBUG}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:DEBUG}

# 編碼設定
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# 靜態資源設定
spring.web.resources.static-locations=classpath:/static/,file:./
spring.web.resources.add-mappings=true

# 資料庫連線池優化（生產環境）
spring.datasource.hikari.maximum-pool-size=${MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# 如果 DATABASE_URL 不是 JDBC 格式，則構建 JDBC URL
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:mysql://localhost:3307/yuan_flower_db?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}}

# 添加詳細的除錯日誌（暫時）
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.example.yuan=DEBUG

# Session 設定
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# LINE Pay 設定 - 使用環境變數
line.pay.channel-id=${LINE_PAY_CHANNEL_ID:your_line_pay_channel_id}
line.pay.channel-secret=${LINE_PAY_CHANNEL_SECRET:your_line_pay_channel_secret}
line.pay.api-url=https://sandbox-api-pay.line.me
line.pay.confirm-url=${APP_BASE_URL:https://yuan-flower.onrender.com}/api/line-pay/confirm
line.pay.cancel-url=${APP_BASE_URL:https://yuan-flower.onrender.com}/checkout