# 伺服器設定（使用環境變數 PORT）
server.port=${PORT:8080}
server.servlet.session.cookie.same-site=Lax

# 資料庫連線設定（支援本地 MySQL 和雲端 PostgreSQL）
# 本地開發使用 MySQL
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3307/yuan_flower_db?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA/Hibernate 設定（動態方言）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}

# Jackson 時間處理設定
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Taipei

# LINE Bot 設定 圓的 U4c4a55b0dba972079d2e2ba1bfebab58 我的 U9d5af8d233fb314507adcbb0f8cc4685
line.bot.channel-token=${LINE_CHANNEL_TOKEN:MaKQ2YreW9GweKSeGRnu9vCRsHqfqJ2h/l1A66pJcmq6//sNkSrn03nfM3HQWaWROAjIIHvwTGk77GKPoHaJOkBEgc4LoHgb+SEVYfPXFlnmb/UrfBQwjJy0VNN18vr19uiHhGm3TM3+sjX7fLDGowdB04t89/1O/w1cDnyilFU=}
line.bot.channel-secret=${LINE_CHANNEL_SECRET:b05fe5cc8191e3f98858fd69f1fe3b32}
